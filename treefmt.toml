# treefmt 配置 (treefmt v2 标准 TOML 格式)
#
# 职责边界:
#   仅声明 "用哪些 formatter 格式化哪些文件". treefmt 本身是个 formatter 多路复用器,
#   主要为编辑器集成 (VSCode/Neovim) 与 CI 一次性格式化服务.
#
# 关键设计:
# - 引入 flake-fhs 后, formatter.<system> = pkgs.treefmt (flake-fhs 在检测到 treefmt.toml 时选择 treefmt).
#   `just fmt` (= nix fmt) 走 treefmt, treefmt 内部按本文件配置分发到 nixpkgs-fmt + ruff.
#   底层 formatter 不变 (仍是 nixpkgs-fmt + ruff), 仅外层 wrapper 从裸 nixpkgs-fmt 切到 treefmt.
# - treefmt ruff 配置替代了原 `just fmt` 中的 `ruff format .`, 格式化职责统一到 treefmt.
# - excludes 留空, 但 .taskmaster/ 由 treefmt 自动按 gitignore 跳过 (treefmt walk=auto).
project-root-file = "flake.nix"

[formatter.nixpkgs-fmt]
command = "nixpkgs-fmt"
includes = ["*.nix"]

[formatter.ruff]
command = "ruff"
options = ["format"]
includes = ["*.py", "*.pyi"]
